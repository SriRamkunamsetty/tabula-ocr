name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-type-test:
    name: lint, type-check, test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package with dev extras
        run: python -m pip install -e ".[dev]"

      - name: Ruff (lint)
        run: ruff check src tests scripts app.py

      - name: Ruff (format check)
        run: ruff format --check src tests scripts app.py

      - name: mypy (strict)
        run: mypy

      - name: pytest with coverage
        run: pytest -q --cov=tabula_ocr --cov-report=xml --cov-report=term-missing

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage-py${{ matrix.python-version }}
          path: coverage.xml
          retention-days: 14

      - name: Offline demo (no GPU) smoke test
        run: |
          TABULA_SCHEMA_DIR=schemas python -m tabula_ocr.cli demo | tee demo.out
          grep -q "HOLD" demo.out   # the abstention path must actually fire

      - name: Contract-mode self-check (real subprocesses, real HTTP, scripted model)
        run: python scripts/contract_selfcheck.py   # exits non-zero unless it scores full marks in time

  harness-benchmark:
    name: pipeline overhead benchmark (no GPU)
    runs-on: ubuntu-latest
    needs: lint-type-test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e .
      - name: Run harness-only benchmark
        run: |
          TABULA_SCHEMA_DIR=schemas python benchmarks/bench_pipeline.py \
            --requests 40 --concurrency 8
      - uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: benchmarks/results.json
          retention-days: 30

  submission-dockerfile-lint:
    name: lint the submission Dockerfile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile.submission
          failure-threshold: error

  docker-build:
    name: build container image
    runs-on: ubuntu-latest
    needs: lint-type-test
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: tabula-ocr:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
